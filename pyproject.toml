[project]
name = "scanne-ta-bouffe"
version = "0.1.0"
description = "Scraper les produits d'Aliments Québec"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
"beautifulsoup4>=4.12.0",
"duckdb>=2.0.0",
]
[project.optional-dependencies]
dev = [
"pytest>=8.2.0",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]